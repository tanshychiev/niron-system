<script>
(function(){
 const form=document.querySelector('[data-ajax-form]'); if(!form)return;
 const alertBox=document.querySelector('[data-form-alert]');
 const button=form.querySelector('button[type=submit]');
 function clearErrors(){form.querySelectorAll('.field-error').forEach(e=>e.remove());form.querySelectorAll('.has-error').forEach(e=>e.classList.remove('has-error'));}
 function fail(message, errors){clearErrors(); alertBox.textContent='Failed: '+message; alertBox.className='ajax-alert fail'; alertBox.hidden=false; let first=null; Object.entries(errors||{}).forEach(([name,items])=>{const input=form.querySelector(`[name="${name}"]`); if(!input)return; const wrap=input.closest('.field')||input.parentElement; wrap.classList.add('has-error'); const div=document.createElement('div');div.className='field-error';div.textContent=(items[0]&&items[0].message)||items[0]||'Invalid value';wrap.appendChild(div);first=first||input;}); if(first){first.scrollIntoView({behavior:'smooth',block:'center'});first.focus();}}
 form.addEventListener('submit',async e=>{e.preventDefault();clearErrors();button.disabled=true;const old=button.textContent;button.textContent='Saving…';try{const r=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'X-Requested-With':'XMLHttpRequest'}});const data=await r.json();if(!r.ok||!data.ok){fail(data.message||'The action could not be completed.',data.errors);return;}alertBox.textContent=data.message||'Saved successfully.';alertBox.className='ajax-alert success';alertBox.hidden=false;form.reset();window.dispatchEvent(new CustomEvent('ajax-form-saved',{detail:data}));}catch(err){fail('Connection problem. Please try again.',{});}finally{button.disabled=false;button.textContent=old;}});
})();
</script>
